server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/pki/server.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;
    ssl_client_certificate /etc/nginx/pki/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 2m;

    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite, never append: client-supplied identity headers are untrusted.
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header Connection "";
    }

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / { return 404; }
}
